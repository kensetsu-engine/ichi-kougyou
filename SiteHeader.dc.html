<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;display=swap" rel="stylesheet">
</helmet>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;padding:clamp(8px,1.4vw,16px) clamp(10px,2.4vw,24px);pointer-events:none">
  <div style="pointer-events:auto;max-width:1400px;margin:0 auto;min-height:64px;padding:8px clamp(14px,2vw,20px);background:#fff;border-radius:clamp(14px,2vw,22px);box-shadow:0 10px 30px rgba(20,52,42,.10);display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'Noto Sans JP',sans-serif;color:#14342A">
    <a href="/" aria-label="株式会社一工業（ホームへ）" style="display:flex;align-items:center;text-decoration:none;flex-shrink:0;min-height:44px">
      <img src="images/logo.png" alt="株式会社一工業" style="height:clamp(30px,4vw,40px);width:auto;display:block">
    </a>
    <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインメニュー" style="display:flex;align-items:center;gap:0">
        <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="6">
          <a href="{{ it.href }}" style="padding:10px 9px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;color:#14342A;text-decoration:none;border-radius:8px;white-space:nowrap;transition:background .2s,color .2s" style-hover="background:#EEF6F0;color:#1D6E3B">{{ it.label }}</a>
        </sc-for>
        <div onMouseEnter="{{ openCo }}" onMouseLeave="{{ closeCo }}" style="position:relative">
          <button type="button" onClick="{{ toggleCo }}" aria-expanded="{{ coOpen }}" aria-haspopup="true" style="appearance:none;cursor:pointer;background:none;border:none;padding:10px 9px;min-height:44px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;color:#14342A;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:4px">会社案内<span aria-hidden="true" style="font-size:10px;color:#1D6E3B">▼</span></button>
          <sc-if value="{{ coOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;min-width:200px">
              <div style="background:#fff;border:1px solid #D2E3D7;border-radius:12px;box-shadow:0 16px 36px rgba(20,52,42,.14);padding:8px;display:flex;flex-direction:column">
                <sc-for list="{{ coItems }}" as="it" hint-placeholder-count="3">
                  <a href="{{ it.href }}" style="display:flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;color:#14342A;text-decoration:none" style-hover="background:#EEF6F0;color:#1D6E3B">{{ it.label }}</a>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
        <a href="/recruit" style="padding:10px 9px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;color:#14342A;text-decoration:none;border-radius:8px;white-space:nowrap" style-hover="background:#EEF6F0;color:#1D6E3B">採用情報</a>
        <a href="tel:07022600001" aria-label="電話をかける 070-2260-0001（受付 7:00〜21:00）" style="margin-left:8px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 12px;color:#14342A;text-decoration:none;white-space:nowrap;line-height:1.2;font-family:'Zen Kaku Gothic New',sans-serif">
          <span style="font-size:1.08rem;font-weight:900;letter-spacing:.03em">070-2260-0001</span>
          <span style="font-size:.7rem;font-weight:700;color:#4C6157">受付 7:00〜21:00</span>
        </a>
        <a href="/form/inquiry" style="min-height:50px;display:flex;align-items:center;justify-content:center;padding:0 20px;background:#B9520E;color:#fff;text-decoration:none;border-radius:999px;white-space:nowrap;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:.95rem;box-shadow:0 3px 0 #8A3C08">お見積り</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggleMenu }}" aria-label="{{ burgerLabel }}" aria-expanded="{{ menuOpen }}" style="position:relative;z-index:80;width:48px;height:48px;border:2px solid #D2E3D7;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex-shrink:0">
        <span aria-hidden="true" style="width:20px;height:2px;display:block;border-radius:2px;background:#14342A"></span>
        <span aria-hidden="true" style="width:20px;height:2px;display:block;border-radius:2px;background:#14342A"></span>
        <span aria-hidden="true" style="width:20px;height:2px;display:block;border-radius:2px;background:#2E9150"></span>
      </button>
    </sc-if>
  </div>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:45;font-family:'Noto Sans JP',sans-serif">
    <div onClick="{{ closeMenu }}" style="position:absolute;inset:0;background:rgba(20,52,42,.32)"></div>
    <nav aria-label="メインメニュー" style="position:absolute;top:calc(64px + 2 * clamp(8px,1.4vw,16px));left:clamp(10px,2.4vw,24px);right:clamp(10px,2.4vw,24px);max-height:calc(100svh - 64px - 4 * clamp(8px,1.4vw,16px) - 64px);overflow-y:auto;background:#fff;border-radius:clamp(16px,3vw,24px);box-shadow:0 24px 60px rgba(20,52,42,.18);padding:clamp(18px,4vw,28px)">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 clamp(14px,3vw,28px)">
        <sc-for list="{{ drawerItems }}" as="it" hint-placeholder-count="14">
          <a href="{{ it.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:10px 6px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;font-weight:700;color:#14342A;text-decoration:none;border-bottom:1px solid #E3EFE6">{{ it.label }}<span aria-hidden="true" style="color:#2E9150">→</span></a>
        </sc-for>
      </div>
      <a href="tel:07022600001" style="margin-top:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;padding:10px;border:2px solid #14342A;color:#14342A;text-decoration:none;border-radius:999px;font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.25"><span style="font-size:1.35rem;font-weight:900;letter-spacing:.04em">070-2260-0001</span><span style="font-size:.76rem;font-weight:700">受付 7:00〜21:00</span></a>
    </nav>
  </div>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:44;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 -6px 20px rgba(20,52,42,.14);padding-bottom:env(safe-area-inset-bottom);background:#14342A">
    <a href="tel:07022600001" aria-label="電話する 070-2260-0001" style="min-height:60px;display:flex;align-items:center;justify-content:center;gap:8px;background:#14342A;color:#fff;text-decoration:none;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:1rem">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"></path></svg>電話する
    </a>
    <a href="/form/inquiry" style="min-height:60px;display:flex;align-items:center;justify-content:center;gap:6px;background:#B9520E;color:#fff;text-decoration:none;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:1rem">お見積り</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:96}}">
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false, coOpen: false };

  componentDidMount() {
    this._onResize = () => {
      const m = window.innerWidth < 1320;
      if (m !== this.state.isMobile) this.setState({ isMobile: m, menuOpen: m ? this.state.menuOpen : false });
    };
    this._onKey = (e) => { if (e.key === 'Escape') this.setState({ menuOpen: false, coOpen: false }); };
    window.addEventListener('resize', this._onResize);
    window.addEventListener('keydown', this._onKey);
    this._onResize();
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('keydown', this._onKey);
  }

  renderVals() {
    const nav = [
      { href: '/construction', label: 'プール工事' },
      { href: '/exterior', label: '外構・エクステリア' },
      { href: '/civil', label: '土木・駐車場' },
      { href: '/blog-ex/instance', label: '施工実績' },
      { href: '/price', label: '料金の目安' },
      { href: '/corporate', label: '法人の方へ' },
    ];
    const co = [
      { href: '/about', label: '一工業について' },
      { href: '/information', label: '会社概要' },
      { href: '/faq', label: 'よくあるご質問' },
    ];
    const drawer = [{ href: '/', label: 'ホーム' }].concat(nav, co, [
      { href: '/recruit', label: '採用情報' },
      { href: '/work', label: '業務案内' },
      { href: '/blog', label: 'コラム' },
      { href: '/form/inquiry', label: 'お問い合わせ' },
    ]);
    return {
      navItems: nav,
      coItems: co,
      drawerItems: drawer,
      coOpen: this.state.coOpen,
      openCo: () => this.setState({ coOpen: true }),
      closeCo: () => this.setState({ coOpen: false }),
      toggleCo: () => this.setState((s) => ({ coOpen: !s.coOpen })),
      isMobile: this.state.isMobile,
      showDesktopNav: !this.state.isMobile,
      menuOpen: this.state.menuOpen,
      burgerLabel: this.state.menuOpen ? 'メニューを閉じる' : 'メニューを開く',
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
